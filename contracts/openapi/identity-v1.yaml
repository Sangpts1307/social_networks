  },
  "components": {
    "securitySchemes": {
      "BearerSession": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "64-character opaque token"
      },
      "GatewayKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Identity-Service-Key"
      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "organization_id",
          "email",
          "display_name",
          "must_change_password",
          "permissions"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "display_name": {
            "type": "string"
          },
          "must_change_password": {
            "type": "boolean"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "errors": {
            "type": "object",
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        }
      },
      "SessionResponse": {
        "type": "object",
        "required": [
          "user"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 255
          },
          "password": {
            "type": "string",
            "maxLength": 1024
          }
        }
      },
      "LoginResponse": {
        "type": "object",
        "required": [
          "token_type",
          "access_token",
          "expires_at",
          "user"
        ],
        "properties": {
          "token_type": {
            "const": "Bearer"
          },
          "access_token": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "user": {
            "$ref": "#/components/schemas/User"
          }
        }
      },
      "PasswordRequest": {
        "type": "object",
        "required": [
          "current_password",
          "password",
          "password_confirmation"
        ],
        "properties": {
          "current_password": {
            "type": "string",
            "maxLength": 1024
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 72,
            "description": "Maximum 72 UTF-8 bytes; uppercase, lowercase, number and symbol; different from current password."
          },
          "password_confirmation": {
            "type": "string"
          }
        }
      },
      "MessageResponse": {
        "type": "object",
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string"
          }
        }
      },
      "HealthResponse": {
        "type": "object",
        "required": [
          "service",
          "status"
        ],
        "properties": {
          "service": {
            "const": "identity-service"
          },
          "status": {
            "const": "ok"
          }
        }
      }
    }
  }
}
