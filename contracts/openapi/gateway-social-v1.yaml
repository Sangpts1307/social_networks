        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - post_id
      - parent_comment_id
      - author_user_id
      - body_markdown
      - body_plaintext
      - created_at
      - updated_at
      - edited_at
    CreateComment:
      type: object
      properties:
        body_markdown:
          type: string
          minLength: 1
          maxLength: 10000
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
