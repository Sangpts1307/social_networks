components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque Identity access_token from POST /api/v1/auth/login. Every request verifies current session
        and rejects must_change_password.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - message
      - code
      - errors
    Meta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - next_cursor
      - has_more
      - limit
    Channel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
          - organization
          - members
        membership_policy:
          type: string
          enum:
          - open
          - managed
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - code
      - name
      - visibility
      - membership_policy
      - created_at
    CreateChannel:
      type: object
      properties:
        code:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9][a-z0-9_-]*$
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        visibility:
          type: string
          enum:
          - organization
          - members
        membership_policy:
          type: string
          enum:
          - open
          - managed
      required:
      - code
      - name
      - visibility
      - membership_policy
    Membership:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        is_member:
          type: boolean
      required:
      - channel_id
      - is_member
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        author_user_id:
          type: string
          format: uuid
        post_type:
          type: string
          enum:
          - update
          - news
          - announcement
        title:
          type: string
          nullable: true
        body_markdown:
          type: string
        body_plaintext:
          type: string
        visibility:
          type: string
          enum:
          - organization
          - channel
        publication_status:
          type: string
          enum:
          - draft
          - published
          - hidden
          - removed
        moderation_status:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
        comments_locked_at:
          type: string
          format: date-time
          nullable: true
        reaction_count:
          type: integer
          minimum: 0
        comment_count:
          type: integer
          minimum: 0
        my_reaction:
          type: string
          nullable: true
          enum:
          - like
          - love
          - sad
          - angry
          - null
        is_saved:
          type: boolean
      required:
      - id
      - channel_id
      - author_user_id
      - post_type
      - title
      - body_markdown
      - body_plaintext
      - visibility
      - publication_status
      - moderation_status
      - published_at
      - created_at
      - updated_at
      - edited_at
      - comments_locked_at
      - reaction_count
      - comment_count
      - my_reaction
      - is_saved
    CreatePost:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        post_type:
          type: string
          enum:
          - update
          - news
          - announcement
          default: update
        title:
          type: string
          nullable: true
          maxLength: 500
        body_markdown:
          type: string
          minLength: 1
          maxLength: 50000
        publication_status:
          type: string
          enum:
          - draft
          - published
          default: published
      required:
      - channel_id
      - body_markdown
      description: Actor and organization are derived from the authenticated session; client-supplied organization_id,
        author_user_id and visibility are rejected. Channel/type are immutable on update. News/announcement require
        a nonempty title and explicit publish permission. HTML tags are stripped; clients must sanitize Markdown
        links/rendering.
    UpdatePost:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 500
        body_markdown:
          type: string
