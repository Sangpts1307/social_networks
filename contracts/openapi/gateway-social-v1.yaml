          - resolved
          - dismissed
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - target_type
      - target_id
      - status
      - created_at
    ModerationInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - hide
          - remove
          - restore
          - lock_comments
          - unlock_comments
        reason_code:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9_]+$
        note:
          type: string
          nullable: true
          maxLength: 5000
      required:
      - action
      - reason_code
    ModerationResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        publication_status:
          type: string
        moderation_status:
          type: string
        comments_locked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - publication_status
      - moderation_status
      - comments_locked_at
    ChannelPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    PostPage:
