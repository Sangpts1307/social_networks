openapi: 3.0.3
info:
  title: Social public API
  version: 1.0.0
  description: 'Shared JSON API for Web, Android and other authenticated clients. All public calls go through Gateway.
    UUID identifiers, UTC ISO 8601 timestamps, no cookies required. Responses use data/meta; errors use message/code/errors.
    Source text is untrusted: clients must safely render Markdown. Scope: channels, text posts, comments, reactions,
    saves, reports and post moderation. Attachments, RSVP, follows, profile enrichment and managed membership administration
    are not implemented in this version.'
servers:
- url: http://127.0.0.1:8080/api/v1/social
  description: Local API Gateway; replace origin for deployment
security:
- bearerAuth: []
tags:
- name: Social
paths:
  /channels:
    get:
      operationId: listSocialChannels
      summary: List visible active channels
      tags:
      - Social
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
        description: Opaque encrypted next_cursor from previous page. Bound to caller, organization, endpoint and
          filters; never decode or construct it.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPage'
        '401':
          description: Invalid/revoked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission, membership or password-change requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or inaccessible resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service authentication not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 120 requests/minute per authenticated organization + user; honor Retry-After. Production
            replicas must share a cache store.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: ''
      security:
      - bearerAuth: []
    post:
      operationId: createSocialChannel
      summary: Create a channel and owner membership
      tags:
      - Social
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          maxLength: 128
          pattern: ^[a-zA-Z0-9._:-]+$
        description: Recommended for mobile retries. Same actor/path/key and identical JSON bytes replay the first
          successful response. Different JSON bytes return 409. Failed requests are not retained. Keys currently
          have no automatic expiration.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
          headers:
            Location:
              schema:
                type: string
              description: Public resource URL when provided.
        '401':
          description: Invalid/revoked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission, membership or password-change requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or inaccessible resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid request or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service authentication not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 120 requests/minute per authenticated organization + user; honor Retry-After. Production
            replicas must share a cache store.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Requires social.channels.manage. Same organization + code must be unique.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannel'
